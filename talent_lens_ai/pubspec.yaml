name: talent_lens_ai
description: Real-time AI athletic action quality assessment for Android.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera: Primary source for real-time video frames (YUV420)
  camera: ^0.10.5+9

  # Pose Detection: ML Kit bridge to MediaPipe BlazePose
  google_mlkit_pose_detection: ^0.10.0

  # TFLite inference: On-device execution of the AQANet LSTM model
  tflite_flutter: ^0.10.4

  # State management: Riverpod provides a robust, testable, and reactive state graph
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  # Flutter Hooks: Reduces boilerplate for animations and widget-local state
  flutter_hooks: ^0.20.5

  # Data & serialization: Ensures value equality and immutable data structures
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local storage: Persistent session history and user settings
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # UI & UX: Professional aesthetics and data visualization
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2           # Smooth biomechanical animations
  fl_chart: ^0.68.0        # Real-time performance analytics charts
  shimmer: ^3.0.0          # Premium skeleton loading states

  # Optional: Firebase (Togglable cloud sync foundation)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Utilities: Enhanced stability and functional programming patterns
  uuid: ^4.4.0
  logger: ^2.4.0           # Structured logging for inference performance
  dartz: ^0.10.1           # Either<Failure, T> for robust error handling
  rxdart: ^0.28.0          # Reactive extensions for complex frame streams

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - models/aqanet_lstm.tflite
